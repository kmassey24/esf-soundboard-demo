<script>

const state={view:'home',musicPlaying:true,allAudioStopped:false,volume:72,savedVolume:72,duck:false,playlist:0,trackIndex:0,sponsor:0,announcement:0,compose:false,editingSponsor:false,customAnnouncements:[],customSponsors:[],draft:'',sponsorDraft:'',voice:'Warm & natural',timer:null,source:'Spotify (concept)'};

const playlists=[{name:'Volunteer Energy Mix',count:'48 songs',detail:'High-energy feel-good favorites'},{name:'Holiday Favorites',count:'32 songs',detail:'Seasonal celebration'},{name:'Feel-Good Classics',count:'56 songs',detail:'Upbeat tracks for all ages'}];

const tracks=[{title:'Sample track',artist:'Demo playlist • no live Spotify data'},{title:'Next song preview',artist:'Demo playlist • no live Spotify data'},{title:'Another sample song',artist:'Demo playlist • no live Spotify data'}];

const sponsorDefault=[{title:'Partner thank-you',description:'Voice memo • Box library • 0:24',message:'Thank you to our amazing sponsors for making today possible!'},{title:'Welcome to the warehouse',description:'Staff recording • 0:31',message:'Welcome to today’s Empty Stocking Fund volunteer shift!'},{title:'Why ESF matters',description:'Mission story • 0:45',message:'Your work helps bring joy to Atlanta families.'}];

const announcementDefault=[{title:'Welcome volunteers!',description:'Warm introduction • AI voice',message:"We're so glad you're here today! Thank you for helping the Empty Stocking Fund bring joy to Atlanta children."},{title:'Sponsor spotlight',description:'DJ-style corporate thank-you • AI voice',message:'A special thank-you to the partners who helped make this event possible.'},{title:'Keep up the good work!',description:'Mid-shift encouragement • AI voice',message:'You are doing incredible work! Keep the energy going. Every gift matters.'},{title:'Closing thank-you',description:'Final message • AI voice',message:'Thank you for spending your day making a difference with the Empty Stocking Fund.'}];

const getSponsor=()=>[...sponsorDefault,...state.customSponsors][state.sponsor]||sponsorDefault[0],getAnnouncement=()=>[...announcementDefault,...state.customAnnouncements][state.announcement]||announcementDefault[0];

const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');

const trim=s=>s.length>47?s.slice(0,45)+'…':s;

function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),4500)}

function duckDemo(label){if(state.duck){toast('Finish the current message before playing another.');return}if(state.timer)clearTimeout(state.timer);state.savedVolume=state.volume;state.volume=Math.min(state.volume,25);state.duck=true;render();toast(`DEMO: ${label} selected. Music reduced to ${state.volume}%. It will return to ${state.savedVolume}%.`);state.timer=setTimeout(()=>{state.duck=false;state.volume=state.savedVolume;state.timer=null;render();toast('DEMO: Message finished. Music restored to its previous volume.')},4000)}

function stopAudio(){if(state.timer)clearTimeout(state.timer);state.timer=null;state.duck=false;state.volume=state.savedVolume;state.musicPlaying=false;state.allAudioStopped=true;render();toast('DEMO: All playback stopped. Tap Start Spotify Music to resume the playlist.')}
function toggleAllAudio(){if(state.allAudioStopped){state.allAudioStopped=false;state.musicPlaying=true;render();toast('DEMO: Spotify music resumed. No Spotify request was made.')}else{stopAudio()}}

const selected=(kind,item)=>`<div class="selection"><div class="tiny">SELECTED MESSAGE</div><div class="title">${esc(item.title)}</div><div class="desc">${esc(item.message)}</div><div class="source">${esc(item.description)}</div></div>`;

function home(){return `${callout()}<div class="cards">

<section class="catcard music"><div class="kicker">01 MUSIC</div><h2>Music from Spotify</h2><div class="np"><div class="album">♫</div><div><div class="tiny">NOW PLAYING · DEMO</div><div class="nptrack">${esc(playlists[state.playlist].name)}</div><div class="artist">${esc(tracks[state.trackIndex].title)} · Spotify concept</div><div class="microcontrols"><span data-quick="prev">❮❮</span><span data-quick="play">${state.musicPlaying?'Ⅱ':'▶'}</span><span data-quick="next">❯❯</span></div></div></div><div class="grow"></div><button class="btn primary music" data-view="music">♫ Open music controls  ›</button></section>

<section class="catcard sponsors"><div class="kicker">02 SPONSORS</div><h2>Sponsor messages</h2>${selected('sponsors',getSponsor())}<div class="grow"></div><button class="btn primary sponsors" data-play="sponsors">▶ Play this message</button><button class="btn secondary" data-view="sponsors">✎ Change / Create custom</button></section>

<section class="catcard announce"><div class="kicker">03 ANNOUNCEMENTS</div><h2>Announcements</h2>${selected('announce',getAnnouncement())}<div class="grow"></div><button class="btn primary announce" data-play="announce">▶ Play this message</button><button class="btn secondary" data-view="announce">✎ Change / Create custom</button></section></div>`}

function callout(){return `<div class="callout ${state.duck?'duck':''}"><span class="check">${state.duck?'♪':'✓'}</span><strong>${state.duck?'A MESSAGE IS PLAYING · MUSIC LOWERED':'AUTOMATIC AUDIO DUCKING IS ON'}</strong><span class="muted">Music ${state.duck?'will return automatically':'lowers for all messages, then returns to the previous volume'}.</span></div>`}

function music(){return `<p class="eyebrow" style="color:#18854b">01  /  MUSIC</p><h1>[Spotify Integration Here]</h1><p class="lead">Demo only.</p><div class="song-layout"><section class="panel"><h3>YOUR PLAYLISTS</h3><p class="hint">Choose music to fit the volunteer shift.</p>${playlists.map((it,i)=>`<button class="playlist ${i===state.playlist?'active':''}" data-playlist="${i}"><span class="art">♫</span><span><span class="play-title">${esc(it.name)}</span><br><span class="play-sub">${esc(it.count)} · ${esc(it.detail)}</span></span></button>`).join('')}</section>

<section class="music-panel"><div class="row" style="justify-content:space-between"><strong style="color:#1db954">◉ Spotify-style playback</strong><span class="pill" style="background:#254b37;color:#d0edd8">SAMPLE UI</span></div><div class="trackrow"><div class="trackcover">♫</div><div><div style="font-size:11px;color:#93b39d;font-weight:750">NOW PLAYING</div><div class="track">${esc(tracks[state.trackIndex].title)}</div><div class="trackmeta">${esc(tracks[state.trackIndex].artist)}</div></div></div><div class="progress"><span></span></div><div class="times"><span>0:48</span><span>3:27</span></div><div class="player-buttons"><button class="control" data-control="shuffle" title="Shuffle">⇄</button><button class="control" data-control="prev" title="Previous">❮❮</button><button class="control big" data-control="play" title="Play or pause">${state.musicPlaying?'Ⅱ':'▶'}</button><button class="control" data-control="next" title="Next">❯❯</button><button class="control" data-control="repeat" title="Repeat">↻</button></div><div class="controlslabel">Shuffle  ·  Previous  ·  Pause/Play  ·  Next  ·  Repeat</div><div class="connect"><span style="color:#bed0c2;font-size:12px;font-weight:800">⌁ PLAYBACK DEVICE</span><select id="device" aria-label="Example playback device"><option>Warehouse Sonos (verify)</option><option>iPad / browser (demo)</option></select></div></section></div>`}

function messageView(kind){const sponsor=kind==='sponsors',arr=sponsor?[...sponsorDefault,...state.customSponsors]:[...announcementDefault,...state.customAnnouncements],selectedId=sponsor?state.sponsor:state.announcement,chosen=arr[selectedId]||arr[0],col=sponsor?'var(--sponsor)':'var(--announce)';return `<p class="eyebrow" style="color:${col}">${sponsor?'02 / SPONSORS':'03 / ANNOUNCEMENTS'}</p><h1>${sponsor?'Sponsor Messages':'Announcements'}</h1><p class="lead">Demo only.</p><div class="twocol"><section class="panel"><h3>SELECTED MESSAGE</h3><div class="selected-large ${kind}"><strong>${esc(chosen.title)}</strong><p>${esc(chosen.message)}</p></div><div class="buttonrow"><button class="btn primary ${kind==='sponsors'?'sponsors':'announce'}" data-play="${kind}">▶ Play this message</button><button class="btn outline" data-edit="${kind}">✎ Change / Create custom</button></div>${(sponsor?state.editingSponsor:state.compose)?editor(kind):''}</section><section class="panel"><h3>${sponsor?'SAVED SPONSOR MESSAGES':'SAVED ANNOUNCEMENTS'}</h3>${arr.map((item,i)=>`<button class="listitem ${i===selectedId?'active':''}" style="--tint:${col};--tintbg:${sponsor?'#fff0f2':'#fff5df'}" data-select="${kind}:${i}"><span class="circle">${sponsor?'▶':'✦'}</span><span><span class="listtitle">${esc(item.title)}</span></span>${i===selectedId?'<span style="margin-left:auto;font-size:11px;font-weight:800">SELECTED</span>':''}</button>`).join('')}<button class="btn outline" data-edit="${kind}" style="margin-top:15px">＋ Create custom ${sponsor?'sponsor message':'announcement'}</button></section></div>`}

function editor(kind){const sponsor=kind==='sponsors',name=sponsor?'sponsorDraft':'draft',draft=state[name]||'',col=sponsor?'var(--sponsor)':'var(--announce)';return `<div style="border-top:1px solid var(--line);margin-top:19px;padding-top:10px"><div class="fieldlabel">CREATE / EDIT ${sponsor?'SPONSOR MESSAGE':'ANNOUNCEMENT'}</div><label class="fieldlabel" for="customtitle">Message title</label><input class="plaininput" id="customtitle" placeholder="${sponsor?'e.g., Thanks to our sponsors':'e.g., Welcome Group A'}" maxlength="75"><label class="fieldlabel" for="customtext">What should the announcement say?</label><textarea id="customtext" class="editor" maxlength="500" placeholder="Type a warm, natural spoken message...">${esc(draft)}</textarea><div class="formgrid">${sponsor?'<button class="btn outline" data-create-mode="recording">＋ Upload recording (future)</button>':'<button class="btn outline" data-preview="announce">▷ Preview voice (demo)</button>'}<button class="btn primary ${sponsor?'sponsors':'announce'}" data-save="${kind}">✓ Save and select</button></div></div>`}

function render(){let v=state.view;document.querySelectorAll('button.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('view').innerHTML= v==='home'?home():v==='music'?music():messageView(v);document.getElementById('vol').value=state.volume;document.getElementById('volumevalue').textContent=state.volume+'%';document.getElementById('docklabel').textContent=state.duck?'MUSIC · DUCKED FOR MESSAGE':`MUSIC · ${state.musicPlaying?'PLAYING':'PAUSED'} (DEMO)`;document.getElementById('docktrack').textContent=playlists[state.playlist].name+(state.duck?' · will restore automatically':'');const toggle=document.getElementById('stopall');toggle.textContent=state.allAudioStopped?'▶ START SPOTIFY MUSIC':'■ STOP ALL AUDIO';toggle.classList.toggle('is-stopped',state.allAudioStopped);toggle.setAttribute('aria-label',state.allAudioStopped?'Start Spotify music (demo)':'Stop all audio (demo)')}

function navTo(v){state.view=v;render()}

document.addEventListener('click',e=>{const el=e.target.closest('button,[data-quick]');if(!el)return;let d=el.dataset;if(d.view){navTo(d.view);return}if(d.play){duckDemo(d.play==='sponsors'?getSponsor().title:getAnnouncement().title);return}if(d.playlist!==undefined){state.playlist=+d.playlist;render();toast('DEMO: Selected playlist. Spotify is not connected.');return}if(d.select){const [kind,n]=d.select.split(':');if(kind==='sponsors')state.sponsor=+n;else state.announcement=+n;render();return}if(d.edit){if(d.edit==='sponsors')state.editingSponsor=!state.editingSponsor;else state.compose=!state.compose;render();return}if(d.preview){toast('DEMO: Voice preview would play privately on the iPad, not over the warehouse speakers.');return}if(d.createMode){toast('To upload real recordings, the Box integration must be connected.');return}if(d.save){const title=(document.getElementById('customtitle')?.value||'').trim(),message=(document.getElementById('customtext')?.value||'').trim();if(!title||!message){toast('Add a message title and message text before saving.');return}const entry={title,description:d.save==='sponsors'?'Custom text · awaiting TTS / Box':'Custom message · AI voice concept',message};if(d.save==='sponsors'){state.customSponsors.push(entry);state.sponsor=sponsorDefault.length+state.customSponsors.length-1;state.editingSponsor=false;state.sponsorDraft=''}else{state.customAnnouncements.push(entry);state.announcement=announcementDefault.length+state.customAnnouncements.length-1;state.compose=false;state.draft=''}render();toast('Saved locally in this demo session and selected.');return}const cmd=d.control||d.quick;if(cmd){switch(cmd){case 'play':state.musicPlaying=!state.musicPlaying;if(state.musicPlaying)state.allAudioStopped=false;break;case 'next':state.trackIndex=(state.trackIndex+1)%tracks.length;break;case 'prev':state.trackIndex=(state.trackIndex+tracks.length-1)%tracks.length;break;case 'shuffle':toast('DEMO: Shuffle toggled.');return;case 'repeat':toast('DEMO: Repeat mode changed.');return}render();toast('DEMO: Music control updated locally, no Spotify request made.');return}});

document.getElementById('stopall').addEventListener('click',toggleAllAudio);document.getElementById('vol').addEventListener('input',e=>{state.volume=+e.target.value;if(!state.duck)state.savedVolume=state.volume;document.getElementById('volumevalue').textContent=state.volume+'%'});document.addEventListener('input',e=>{if(e.target.id==='customtext'){if(state.view==='sponsors')state.sponsorDraft=e.target.value;else state.draft=e.target.value}});document.addEventListener('change',e=>{if(e.target.id==='device')toast('DEMO only: device selection needs a real supported integration.')});render();

</script>

</body></html>
