<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#123e49">
<title>ESF Event Soundboard Demo</title>

<style>
:root {
  --navy: #163b49;
  --ink: #20323d;
  --sub: #657982;
  --line: #dce6e8;
  --bg: #f5f7f8;
  --card: #fff;
  --esfred: #d52c40;
  --esfteal: #25aab2;
  --esfyellow: #f4be34;
  --music: #1db954;
  --musicdark: #11241b;
  --sponsor: #d52c40;
  --announce: #e2a316;
  --sponsorsoft: #fff0f2;
  --announcesoft: #fff5df;
  --mint: #e1f6eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e5ebed;
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid var(--esfteal);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
  opacity: .6;
}

.demo-bar {
  max-width: 1260px;
  margin: 14px auto 10px;
  padding: 9px 18px;
  background: #f6f0d8;
  border: 1px solid #ead99f;
  border-radius: 11px;
  color: #604f26;
  line-height: 1.5;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  gap: 18px;
}

.app {
  width: min(1180px, 100%);
  height: min(820px, calc(100dvh - 70px));
  min-height: 0;
  margin: 0 auto;
  background: var(--bg);
  border-radius: 20px;
  box-shadow: 0 20px 75px #1e41432a;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.masthead {
  flex: 0 0 91px;
  height: 91px;
  background: #fff;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  padding: 10px 29px;
  border-bottom: 4px solid var(--esfteal);
  gap: 12px;
}

.logo {
  width: 143px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  justify-self: start;
}

.logo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.masthead-title {
  min-width: 0;
  text-align: center;
}

.brandname {
  font-size: 27px;
  color: var(--navy);
  font-weight: 850;
  letter-spacing: -.025em;
  white-space: nowrap;
  line-height: 1.1;
}

.status {
  display: flex;
  align-items: center;
  justify-self: end;
  border-radius: 20px;
  background: #eef2f4;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 750;
  color: var(--navy);
  white-space: nowrap;
}

.tabs {
  display: flex;
  flex: 0 0 53px;
  min-height: 53px;
  gap: 11px;
  padding: 10px 30px 0;
}

.tab {
  border: 1px solid var(--line);
  color: var(--sub);
  background: #fff;
  border-radius: 10px 10px 3px 3px;
  height: 43px;
  min-width: 167px;
  padding: 0 20px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .03em;
}

.tab.home-link {
  min-width: 112px;
}

.tab.active[data-view="home"] {
  background: var(--navy);
  color: #fff;
}

.tab.active[data-view="music"] {
  background: var(--music);
  border-color: var(--music);
  color: #073a20;
}

.tab.active[data-view="sponsors"] {
  background: var(--sponsor);
  border-color: var(--sponsor);
  color: #fff;
}

.tab.active[data-view="announce"] {
  background: var(--esfyellow);
  border-color: var(--esfyellow);
  color: #3d3107;
}

.view {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-gutter: stable;
  padding: 17px 30px 15px;
}

.eyebrow {
  text-transform: uppercase;
  color: var(--esfred);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: .065em;
  margin: 0 0 7px;
}

.view h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.025em;
  margin: 0 0 7px;
  color: var(--ink);
}

.lead {
  font-size: 15px;
  color: var(--sub);
  margin: 0;
}

.btn {
  height: 49px;
  border: 0;
  border-radius: 12px;
  font-weight: 800;
  text-align: left;
  padding: 0 16px;
  font-size: 15px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: center;
}

.btn.primary.music {
  background: #122820;
  color: #fff;
}

.btn.primary.sponsors {
  background: var(--sponsor);
  color: #fff;
}

.btn.primary.announce {
  background: var(--esfyellow);
  color: #2f3318;
}

.btn.outline {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
}

/* Home soundboard */

.view:has(.soundboard) {
  display: flex;
  flex-direction: column;
  padding: 20px 30px;
}

.view:has(.soundboard) .cards {
  display: grid;
  flex: 1 1 0;
  min-height: 0;
  margin: 0;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  align-items: stretch;
}

.catcard {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  position: relative;
  overflow: hidden;
}

.catcard::before {
  content: "";
  height: 8px;
  background: var(--accent);
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
}

.catcard.music {
  --accent: var(--music);
}

.catcard.sponsors {
  --accent: var(--sponsor);
}

.catcard.announce {
  --accent: var(--announce);
}

.view:has(.soundboard) .catcard {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) 52px;
  height: 100%;
  min-height: 0;
  padding: 20px;
}

.soundboard .catcard h2.kicker {
  justify-self: start;
  margin: 0 0 16px;
  padding: 9px 12px;
  font-size: 16px;
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: .015em;
  border-radius: 18px;
}

.music .kicker {
  background: #e3f6e9;
  color: #187143;
}

.sponsors .kicker {
  background: var(--sponsorsoft);
  color: #b32135;
}

.announce .kicker {
  background: var(--announcesoft);
  color: #885e0b;
}

.selection {
  background: #f7fafb;
  border-radius: 12px;
}

.soundboard .catcard .selection {
  height: auto;
  min-height: 0;
  margin: 0 0 16px;
  padding: 16px;
  overflow: hidden;
}

.soundboard .music .selection {
  background: #e3f6e9;
}

.sponsors .selection {
  background: var(--sponsorsoft);
}

.announce .selection {
  background: var(--announcesoft);
}

.tiny {
  font-weight: 850;
  color: var(--sub);
  font-size: 10px;
  letter-spacing: .06em;
}

.soundboard .music .tiny {
  color: #187143;
}

.sponsors .tiny {
  color: #b4263a;
}

.announce .tiny {
  color: #8b6515;
}

.soundboard .catcard .selection .title {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.3;
  margin: 12px 0 10px;
}

.soundboard .catcard .selection .desc {
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
}

.channel-state {
  color: #187143;
  font-size: 12px;
  font-weight: 750;
  margin-top: 16px;
}

.soundboard .sound-pad {
  height: 52px;
  min-height: 52px;
  font-size: 15px;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 11px;
  line-height: 1.25;
}

.soundboard .sound-pad > span:first-child {
  font-size: 20px;
}

.soundboard .sound-pad.is-playing {
  box-shadow: inset 0 0 0 3px #163b4926;
}

.soundboard .sound-pad:disabled {
  opacity: .5;
}

/* Spotify page */

.song-layout {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: 18px;
  margin-top: 17px;
  align-items: stretch;
}

.panel {
  background: #fff;
  border: 1px solid var(--line);
  padding: 20px;
  border-radius: 18px;
}

.panel h3 {
  font-size: 13px;
  letter-spacing: .065em;
  color: var(--sub);
  margin: 2px 0 9px;
}

.hint {
  color: var(--sub);
  font-size: 13px;
  margin: 0 0 15px;
}

.playlist {
  background: #f5f8f8;
  border: 2px solid transparent;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  width: 100%;
  text-align: left;
  margin: 9px 0;
  min-height: 81px;
}

.playlist.active {
  background: #e2f4e9;
  border-color: #91d8a8;
}

.art {
  width: 55px;
  height: 55px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 10px;
  background: var(--navy);
  color: #fff;
  font-size: 27px;
}

.playlist.active .art {
  background: #238e55;
}

.play-title {
  font-size: 16px;
  font-weight: 800;
}

.play-sub {
  color: var(--sub);
  font-size: 12px;
  margin-top: 5px;
}

.music-panel {
  background: var(--musicdark);
  border-radius: 18px;
  padding: 20px;
  color: #fff;
  min-height: 0;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.pill {
  border-radius: 20px;
  background: #e8eef1;
  padding: 7px 10px;
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: #4f626e;
}

.trackrow {
  display: flex;
  gap: 18px;
  align-items: center;
  margin: 10px 0 15px;
}

.trackcover {
  width: 105px;
  height: 105px;
  border-radius: 13px;
  background: linear-gradient(145deg, #41795c, #142e24);
  display: grid;
  place-items: center;
  color: #caf4d2;
  font-size: 54px;
  flex-shrink: 0;
}

.track {
  font-size: 23px;
  font-weight: 850;
}

.trackmeta {
  font-size: 13px;
  color: #aac4b4;
  margin-top: 8px;
}

.progress {
  height: 8px;
  border-radius: 20px;
  background: #335343;
  overflow: hidden;
  margin: 14px 0;
}

.progress span {
  display: block;
  height: 100%;
  width: 27%;
  background: var(--music);
}

.times {
  display: flex;
  justify-content: space-between;
  color: #b7d2c2;
  font-size: 12px;
}

.player-buttons {
  display: flex;
  justify-content: center;
  gap: 16px;
  align-items: center;
  margin: 19px 0;
}

.control {
  border: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #2a4d3c;
  color: #fff;
  width: 50px;
  height: 50px;
  font-size: 19px;
}

.control.big {
  background: var(--music);
  color: #113c22;
  width: 68px;
  height: 68px;
  font-size: 25px;
}

.controlslabel {
  color: #b7d2c2;
  font-size: 12px;
  text-align: center;
}

.connect {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 17px;
  gap: 12px;
}

.connect select {
  padding: 12px;
  border-radius: 10px;
  background: #eff5f1;
  color: #133522;
  border: 0;
  font-weight: 700;
  width: 250px;
}

/* Sponsor and announcement pages */

.manager-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.return-home {
  flex: 0 0 auto;
  width: auto;
  height: 44px;
  font-size: 12px;
  padding: 0 14px;
  white-space: nowrap;
}

.twocol {
  display: grid;
  grid-template-columns: 1fr .82fr;
  gap: 18px;
  margin-top: 20px;
}

.selected-large {
  border-radius: 14px;
  padding: 24px 22px;
  background: #f9fafa;
  border: 1px solid var(--line);
  margin-top: 15px;
  min-height: 224px;
}

.selected-large.sponsors {
  background: var(--sponsorsoft);
  border-color: #ffe2e5;
}

.selected-large.announce {
  background: var(--announcesoft);
  border-color: #f7e6c1;
}

.selected-large strong {
  display: block;
  font-size: 24px;
  line-height: 1.25;
  margin: 0 0 16px;
}

.selected-large p {
  margin: 0;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
}

.buttonrow {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

.buttonrow .btn {
  flex: 1;
  font-size: 14px;
  white-space: nowrap;
}

.message-playback {
  display: flex;
  gap: 8px;
}

.message-playback > .btn {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  padding: 0 10px;
}

.message-playback > .message-stop {
  flex: 0 0 80px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
}

.buttonrow > .message-playback {
  flex: 1;
}

.listitem {
  width: 100%;
  background: #f8fafb;
  border: 1px solid transparent;
  text-align: left;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 73px;
  margin: 9px 0;
}

.listitem.active {
  border-color: var(--tint);
  background: var(--tintbg);
}

.circle {
  display: grid;
  place-items: center;
  border-radius: 12px;
  width: 43px;
  height: 43px;
  background: var(--tintbg);
  color: var(--tint);
  font-size: 20px;
  flex-shrink: 0;
}

.listtitle {
  font-weight: 800;
  font-size: 14px;
}

.editor {
  width: 100%;
  border: 1px solid var(--line);
  background: #fafafa;
  border-radius: 12px;
  padding: 14px;
  resize: vertical;
  min-height: 135px;
  line-height: 1.55;
  color: var(--ink);
}

.fieldlabel {
  display: block;
  font-size: 11px;
  color: var(--sub);
  font-weight: 850;
  letter-spacing: .07em;
  margin: 17px 0 8px;
}

.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.plaininput {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 13px;
  background: #fff;
  color: var(--ink);
}

/* Persistent audio controls */

.dock {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  background: #fff;
  border-top: 1px solid var(--line);
  min-height: 99px;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) 220px;
  align-items: center;
  padding: 10px 30px;
  gap: 8px 17px;
}

.dockicon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 44px;
  background: #e4f7e9;
  border-radius: 12px;
  color: #21a95e;
  font-size: 27px;
}

.docktext {
  min-width: 0;
}

.dock .label {
  font-size: 11px;
  color: var(--sub);
  font-weight: 850;
}

.dock .trackline {
  font-size: 14px;
  font-weight: 750;
  margin-top: 7px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.volume-controls {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  min-width: 0;
}

.dock .volume {
  width: auto;
  min-width: 0;
  display: grid;
  grid-template-rows: 26px 28px 44px;
  gap: 2px;
}

.vol-label {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 4ch;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--sub);
  font-size: 11px;
  font-weight: 850;
}

.vol-label span {
  white-space: nowrap;
}

.vol-label output {
  color: var(--ink);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.volume input[type="range"] {
  display: block;
  margin: 0;
  width: 100%;
  height: 28px;
  min-width: 0;
  min-height: 22px;
  accent-color: #23a876;
}

.sponsor-volume input[type="range"] {
  accent-color: var(--sponsor);
}

.announcement-volume input[type="range"] {
  accent-color: var(--announce);
}

.transport {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.transport .control {
  width: 44px;
  height: 44px;
  background: #e3f6e9;
  color: #187143;
  font-size: 18px;
}

.transport .control.play {
  background: var(--music);
  color: #073a20;
}

.channel-stop {
  height: 44px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  background: #fff;
}

.channel-stop.sponsors {
  color: #b32135;
  border: 1px solid #e5a3ad;
}

.channel-stop.announce {
  color: #885e0b;
  border: 1px solid #e5c47b;
}

.channel-stop:disabled {
  opacity: .5;
}

.stopall {
  width: 100%;
  min-width: 0;
  height: 44px;
  grid-column: 3;
  grid-row: 1;
  border: 0;
  background: #bd3645;
  color: #fff;
  font-size: 13px;
  font-weight: 850;
  border-radius: 12px;
  white-space: nowrap;
}

.stopall.is-stopped {
  background: #168451;
}

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 25px;
  z-index: 50;
  background: #133c43;
  color: #fff;
  padding: 14px 22px;
  border-radius: 14px;
  box-shadow: 0 12px 45px #0004;
  font-size: 14px;
  max-width: 90vw;
  line-height: 1.45;
}

.toast.hidden {
  display: none;
}

/* Compact layouts */

@media (min-width: 951px) and (max-height: 850px) {
  .view:has(.song-layout),
  .view:has(.twocol) {
    padding-top: 12px;
    padding-bottom: 9px;
  }

  .view:has(.song-layout) .eyebrow,
  .view:has(.twocol) .eyebrow {
    margin-bottom: 4px;
  }

  .view:has(.song-layout) h1,
  .view:has(.twocol) h1 {
    font-size: 25px;
    margin-bottom: 5px;
  }

  .view:has(.song-layout) .lead,
  .view:has(.twocol) .lead {
    font-size: 13px;
  }

  .song-layout {
    margin-top: 9px;
    gap: 13px;
  }

  .song-layout .panel {
    padding: 13px 15px;
  }

  .song-layout .panel h3 {
    margin: 0 0 5px;
  }

  .song-layout .hint {
    margin-bottom: 8px;
    font-size: 12px;
  }

  .song-layout .playlist {
    min-height: 64px;
    padding: 7px 10px;
    margin: 5px 0;
    gap: 10px;
  }

  .song-layout .art {
    width: 46px;
    height: 46px;
    font-size: 22px;
  }

  .song-layout .play-title {
    font-size: 14px;
  }

  .song-layout .play-sub {
    font-size: 11px;
    margin-top: 3px;
  }

  .music-panel {
    padding: 13px 15px;
  }

  .trackrow {
    margin: 7px 0 8px;
    gap: 11px;
  }

  .trackcover {
    width: 74px;
    height: 74px;
    font-size: 41px;
  }

  .track {
    font-size: 19px;
  }

  .trackmeta {
    font-size: 12px;
    margin-top: 5px;
  }

  .progress {
    height: 6px;
    margin: 8px 0;
  }

  .player-buttons {
    margin: 12px 0;
    gap: 11px;
  }

  .control {
    width: 44px;
    height: 44px;
    font-size: 17px;
  }

  .control.big {
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .connect {
    margin-top: 11px;
  }

  .connect select {
    padding: 8px;
    width: 210px;
    font-size: 12px;
  }

  .twocol {
    margin-top: 10px;
    gap: 13px;
  }

  .twocol .panel {
    padding: 13px 15px;
  }

  .twocol .panel h3 {
    margin: 0 0 8px;
  }

  .selected-large {
    min-height: 164px;
    padding: 14px 16px;
    margin-top: 9px;
  }

  .selected-large strong {
    margin: 0 0 9px;
    font-size: 20px;
  }

  .selected-large p {
    font-size: 14px;
    line-height: 1.4;
  }

  .buttonrow {
    margin-top: 10px;
  }

  .buttonrow .btn {
    height: 45px;
    font-size: 13px;
    white-space: normal;
  }

  .listitem {
    min-height: 53px;
    padding: 6px 10px;
    margin: 5px 0;
  }

  .circle {
    width: 36px;
    height: 36px;
  }

  .listtitle {
    font-size: 13px;
  }

  .twocol .panel > .btn.outline {
    margin-top: 8px !important;
  }
}

@media (max-width: 950px) {
  .demo-bar {
    margin: 0;
    border-radius: 0;
  }

  .app {
    border-radius: 0;
    box-shadow: none;
    height: min(820px, calc(100dvh - 44px));
  }

  .masthead {
    padding: 10px 17px;
  }

  .logo {
    width: 120px;
    height: 55px;
  }

  .brandname {
    font-size: 23px;
  }

  .status {
    display: none;
  }

  .tabs {
    padding: 10px 16px 0;
    gap: 7px;
    overflow-x: auto;
  }

  .tab {
    min-width: 0;
    padding: 0 12px;
    flex-shrink: 0;
  }

  .view {
    padding: 20px 17px;
  }

  .song-layout,
  .twocol {
    grid-template-columns: 1fr;
  }

  .view:has(.soundboard) {
    padding: 16px;
  }

  .view:has(.soundboard) .cards {
    gap: 14px;
  }

  .view:has(.soundboard) .catcard {
    padding: 16px 12px;
  }

  .soundboard .catcard h2.kicker {
    font-size: 13px;
    padding: 8px 9px;
    letter-spacing: 0;
    margin-bottom: 12px;
  }

  .soundboard .catcard .selection {
    padding: 12px;
    margin-bottom: 12px;
  }

  .soundboard .catcard .selection .title {
    font-size: 16px;
  }

  .soundboard .sound-pad {
    font-size: 14px;
    gap: 8px;
  }

  .dock {
    padding: 10px 16px;
    gap: 8px 14px;
    grid-template-columns: 46px minmax(0, 1fr) 190px;
  }

  .volume-controls {
    gap: 16px;
  }
}

@media (min-width: 651px) and (max-height: 740px) {
  .masthead {
    flex-basis: 72px;
    height: 72px;
  }

  .masthead .logo {
    height: 50px;
  }

  .tabs {
    flex-basis: 49px;
    min-height: 49px;
    padding-top: 6px;
  }

  .dock {
    padding-top: 8px;
    padding-bottom: 8px;
    gap: 6px 14px;
  }

  .dockicon,
  .stopall {
    height: 40px;
  }

  .dock .volume {
    grid-template-rows: 22px 24px 36px;
  }

  .volume input[type="range"] {
    height: 24px;
    min-height: 24px;
  }

  .transport .control,
  .channel-stop {
    height: 36px;
  }

  .transport .control {
    width: 40px;
  }

  .view:has(.soundboard) {
    padding-top: 12px;
    padding-bottom: 12px;
  }

  .view:has(.soundboard) .catcard {
    grid-template-rows: auto minmax(0, 1fr) 48px;
    padding: 12px;
  }

  .soundboard .catcard h2.kicker {
    margin-bottom: 10px;
    padding: 7px 9px;
    font-size: 14px;
  }

  .soundboard .catcard .selection {
    padding: 10px;
    margin-bottom: 10px;
  }

  .soundboard .catcard .selection .title {
    font-size: 16px;
    margin: 8px 0 6px;
  }

  .soundboard .catcard .selection .desc {
    font-size: 12px;
    -webkit-line-clamp: 2;
  }

  .soundboard .channel-state {
    display: none;
  }

  .soundboard .sound-pad {
    height: 48px;
    min-height: 48px;
    font-size: 14px;
  }
}

@media (max-width: 650px) {
  .view:has(.soundboard) .cards {
    grid-template-columns: 1fr;
    flex: 0 0 auto;
  }

  .view:has(.soundboard) .catcard {
    height: auto;
    grid-template-rows: auto 120px 48px;
  }

  .soundboard .sound-pad {
    height: 48px;
    min-height: 48px;
    font-size: 15px;
  }

  .soundboard .channel-state {
    display: none;
  }

  .manager-heading {
    flex-direction: column;
    align-items: start;
    gap: 12px;
  }
}

@media (max-width: 560px) {
  .masthead {
    flex-basis: 82px;
    height: 82px;
    gap: 8px;
  }

  .masthead .logo {
    width: clamp(54px, 17vw, 90px);
    height: 46px;
  }

  .masthead .brandname {
    font-size: clamp(15px, 4vw, 19px);
    white-space: nowrap;
  }

  .app {
    height: 100dvh;
  }

  .view h1 {
    font-size: 25px;
  }

  .buttonrow {
    flex-direction: column;
  }

  .formgrid {
    grid-template-columns: 1fr;
  }

  .dock {
    grid-template-columns: 36px minmax(0, 1fr);
    max-height: 48dvh;
    overflow-y: auto;
  }

  .dockicon {
    width: 36px;
  }

  .stopall {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .volume-controls {
    grid-template-columns: 1fr;
    gap: 12px;
  }
}
</style>
</head>

      <div class="trackline" id="docktrack">Volunteer Energy Mix</div>
    </div>

    <button id="stopall" class="stopall">■ STOP ALL AUDIO</button>

    <div class="volume-controls" role="group" aria-label="Volume controls">
      <div class="volume music-volume">
        <label for="vol" class="vol-label">
          <span>MUSIC VOLUME</span>
          <output id="volumevalue" for="vol">72%</output>
        </label>

        <input
          id="vol"
          type="range"
          min="0"
          max="100"
          value="72"
          aria-label="Music volume simulation"
          aria-valuetext="72 percent"
        >

        <div class="transport" role="group" aria-label="Spotify playback controls">
          <button class="control" data-control="prev" aria-label="Previous Spotify track" title="Previous track">❮❮</button>
          <button class="control play" id="dockplay" data-control="play" aria-label="Pause Spotify music" title="Pause Spotify music">Ⅱ</button>
          <button class="control" data-control="next" aria-label="Next Spotify track" title="Next track">❯❯</button>
        </div>
      </div>

      <div class="volume sponsor-volume">
        <label for="sponsorvol" class="vol-label">
          <span>SPONSORS VOLUME</span>
          <output id="sponsorvolumevalue" for="sponsorvol">80%</output>
        </label>

        <input
          id="sponsorvol"
          type="range"
          min="0"
          max="100"
          value="80"
          aria-label="Sponsor volume simulation"
          aria-valuetext="80 percent"
        >

        <button class="channel-stop sponsors" data-stop="sponsors" aria-label="Stop sponsor message" disabled>■ Stop sponsor</button>
      </div>

      <div class="volume announcement-volume">
        <label for="announcementvol" class="vol-label">
          <span>ANNOUNCEMENTS VOLUME</span>
          <output id="announcementvolumevalue" for="announcementvol">80%</output>
        </label>

        <input
          id="announcementvol"
          type="range"
          min="0"
          max="100"
          value="80"
          aria-label="Announcements volume simulation"
          aria-valuetext="80 percent"
        >

        <button class="channel-stop announce" data-stop="announce" aria-label="Stop announcement" disabled>■ Stop announcement</button>
      </div>
    </div>
  </div>
</main>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
const state = {
  view: "home",
  musicPlaying: true,
  allAudioStopped: false,
  volume: 72,
  savedVolume: 72,
  announcementVolume: 80,
  sponsorVolume: 80,
  activeMessage: null,
  playingItem: null,
  duck: false,
  playlist: 0,
  trackIndex: 0,
  sponsor: 0,
  announcement: 0,
  compose: false,
  editingSponsor: false,
  customAnnouncements: [],
  customSponsors: [],
  draft: "",
  sponsorDraft: "",
  timer: null
};

const playlists = [
  {
    name: "Volunteer Energy Mix",
    count: "48 songs",
    detail: "High-energy feel-good favorites"
  },
  {
    name: "Holiday Favorites",
    count: "32 songs",
    detail: "Seasonal celebration"
  },
  {
    name: "Feel-Good Classics",
    count: "56 songs",
    detail: "Upbeat tracks for all ages"
  }
];

const tracks = [
  {
    title: "Sample track",
    artist: "Demo playlist • no live Spotify data"
  },
  {
    title: "Next song preview",
    artist: "Demo playlist • no live Spotify data"
  },
  {
    title: "Another sample song",
    artist: "Demo playlist • no live Spotify data"
  }
];

const sponsorDefault = [
  {
    title: "Partner thank-you",
    description: "Voice memo • Box library • 0:24",
    message: "Thank you to our amazing sponsors for making today possible!"
  },
  {
    title: "Welcome to the warehouse",
    description: "Staff recording • 0:31",
    message: "Welcome to today’s Empty Stocking Fund volunteer shift!"
  },
  {
    title: "Why ESF matters",
    description: "Mission story • 0:45",
    message: "Your work helps bring joy to Atlanta families."
  }
];

const announcementDefault = [
  {
    title: "Welcome volunteers!",
    description: "Warm introduction • AI voice",
    message: "We're so glad you're here today! Thank you for helping the Empty Stocking Fund bring joy to Atlanta children."
  },
  {
    title: "Sponsor spotlight",
    description: "DJ-style corporate thank-you • AI voice",
    message: "A special thank-you to the partners who helped make this event possible."
  },
  {
    title: "Keep up the good work!",
    description: "Mid-shift encouragement • AI voice",
    message: "You are doing incredible work! Keep the energy going. Every gift matters."
  },
  {
    title: "Closing thank-you",
    description: "Final message • AI voice",
    message: "Thank you for spending your day making a difference with the Empty Stocking Fund."
  }
];

function getSponsor() {
  return [...sponsorDefault, ...state.customSponsors][state.sponsor] || sponsorDefault[0];
}

function getAnnouncement() {
  return [...announcementDefault, ...state.customAnnouncements][state.announcement] || announcementDefault[0];
}

function esc(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function toast(text) {
  const element = document.getElementById("toast");
  element.textContent = text;
  element.classList.remove("hidden");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    element.classList.add("hidden");
  }, 4500);
}

function finishMessage() {
  if (state.timer) {
    clearTimeout(state.timer);
  }

  state.timer = null;
  state.activeMessage = null;
  state.playingItem = null;
  state.duck = false;
  state.volume = state.savedVolume;

  render();
}

function duckDemo(kind, label) {
  if (state.activeMessage) {
    toast("Stop or finish the current message before playing another.");
    return;
  }

  state.savedVolume = state.volume;
  state.volume = Math.min(state.savedVolume, 25);
  state.activeMessage = kind;

  state.playingItem = {
    ...(kind === "sponsors" ? getSponsor() : getAnnouncement())
  };

  state.duck = true;
  state.allAudioStopped = false;

  render();

  const level = kind === "sponsors"
    ? state.sponsorVolume
    : state.announcementVolume;

  toast(`DEMO: ${label} playing at ${level}%. Music reduced to ${state.volume}%.`);

  state.timer = setTimeout(() => {
    finishMessage();
    toast("DEMO: Message finished. Music restored to its previous volume.");
  }, 4000);
}

function stopMessage(kind) {
  if (state.activeMessage !== kind) {
    return;
  }

  finishMessage();

  toast(
    `DEMO: ${kind === "sponsors" ? "Sponsor message" : "Announcement"} stopped. Music volume restored.`
  );
}

function stopAudio() {
  if (state.timer) {
    clearTimeout(state.timer);
  }

  state.timer = null;
  state.activeMessage = null;
  state.playingItem = null;
  state.duck = false;
  state.volume = state.savedVolume;
  state.musicPlaying = false;
  state.allAudioStopped = true;

  render();

  toast("DEMO: All playback stopped. Tap Start Spotify Music to resume the playlist.");
}

function toggleAllAudio() {
  if (state.allAudioStopped) {
    state.allAudioStopped = false;
    state.musicPlaying = true;

    render();

    toast("DEMO: Spotify music resumed. No Spotify request was made.");
  } else {
    stopAudio();
  }
}

function messageActions(kind) {
  const active = state.activeMessage === kind;

  return `
    <div class="message-playback">
      <button
        class="btn primary ${kind === "sponsors" ? "sponsors" : "announce"}"
        data-play="${kind}"
        ${state.activeMessage ? "disabled" : ""}
      >
        ▶ ${active ? "Playing…" : "Play message"}
      </button>

      <button
        class="btn message-stop"
        data-stop="${kind}"
        aria-label="Stop ${kind === "sponsors" ? "sponsor message" : "announcement"}"
        ${active ? "" : "disabled"}
      >
        ■ Stop
      </button>
    </div>
  `;
}

function soundboardMessage(kind) {
  const active = state.activeMessage === kind;

  const item = active
    ? state.playingItem
    : kind === "sponsors"
      ? getSponsor()
      : getAnnouncement();

  const title = kind === "sponsors" ? "Sponsor message" : "Announcement";

  return `
    <section class="catcard ${kind}">
      <h2 class="kicker">
        ${kind === "sponsors" ? "02 SPONSORS" : "03 ANNOUNCEMENTS"}
      </h2>

      <div class="selection">
        <div class="tiny">${active ? "PLAYING NOW" : "READY TO PLAY"}</div>
        <div class="title">${esc(item.title)}</div>
        <div class="desc">${esc(item.message)}</div>
      </div>

      <button
        class="btn primary ${kind === "sponsors" ? "sponsors" : "announce"} sound-pad ${active ? "is-playing" : ""}"
        ${active ? "data-stop" : "data-play"}="${kind}"
        ${state.activeMessage && !active ? "disabled" : ""}
        aria-label="${active ? "Stop" : "Play"} ${title.toLowerCase()}"
      >
        <span aria-hidden="true">${active ? "■" : "▶"}</span>
        <span>${active ? "Stop" : "Play"} ${title.toLowerCase()}</span>
      </button>
    </section>
  `;
}

function home() {
  return `
    <div class="cards soundboard">
      <section class="catcard music">
        <h2 class="kicker">01 MUSIC</h2>

        <div class="selection">
          <div class="tiny">CURRENT PLAYLIST</div>
          <div class="title">${esc(playlists[state.playlist].name)}</div>
          <div class="desc">${esc(tracks[state.trackIndex].title)}</div>
          <div class="channel-state">
            ${
              state.musicPlaying
                ? state.duck
                  ? "Music lowered for message"
                  : "Music is playing"
                : "Music is paused"
            }
          </div>
        </div>

        <button
          class="btn primary music sound-pad"
          data-control="play"
          aria-label="${state.musicPlaying ? "Pause music" : "Play music"}"
        >
          <span aria-hidden="true">${state.musicPlaying ? "Ⅱ" : "▶"}</span>
          <span>${state.musicPlaying ? "Pause music" : "Play music"}</span>
        </button>
      </section>

      ${soundboardMessage("sponsors")}
      ${soundboardMessage("announce")}
    </div>
  `;
}

function pageHeading(title, description) {
  return `
    <div class="manager-heading">
      <div>
        <h1>${esc(title)}</h1>
        <p class="lead">${esc(description)}</p>
      </div>

      <button class="btn outline return-home" data-view="home">
        ← Back to soundboard
      </button>
    </div>
  `;
}

function music() {
  return `
    <p class="eyebrow" style="color:#18854b">01 / MUSIC</p>
    <h1>[Spotify Integration Here]</h1>
    <p class="lead">Demo only.</p>

    <div class="song-layout">
      <section class="panel">
        <h3>YOUR PLAYLISTS</h3>
        <p class="hint">Choose music to fit the volunteer shift.</p>

        ${
          playlists.map((item, index) => `
            <button
              class="playlist ${index === state.playlist ? "active" : ""}"
              data-playlist="${index}"
              aria-pressed="${index === state.playlist}"
            >
              <span class="art">♫</span>
              <span>
                <span class="play-title">${esc(item.name)}</span>
                <br>
                <span class="play-sub">
                  ${esc(item.count)} · ${esc(item.detail)}
                </span>
              </span>
            </button>
          `).join("")
        }
      </section>

      <section class="music-panel">
        <div class="row" style="justify-content:space-between">
          <strong style="color:#1db954">◉ Spotify-style playback</strong>
          <span class="pill" style="background:#254b37;color:#d0edd8">SAMPLE UI</span>
        </div>

        <div class="trackrow">
          <div class="trackcover">♫</div>
          <div>
            <div style="font-size:11px;color:#93b39d;font-weight:750">NOW PLAYING</div>
            <div class="track">${esc(tracks[state.trackIndex].title)}</div>
            <div class="trackmeta">${esc(tracks[state.trackIndex].artist)}</div>
          </div>
        </div>

        <div class="progress"><span></span></div>

        <div class="times">
          <span>0:48</span>
          <span>3:27</span>
        </div>

        <div class="player-buttons">
          <button class="control" data-control="shuffle" title="Shuffle">⇄</button>
          <button class="control" data-control="prev" title="Previous">❮❮</button>
          <button class="control big" data-control="play" title="Play or pause">
            ${state.musicPlaying ? "Ⅱ" : "▶"}
          </button>
          <button class="control" data-control="next" title="Next">❯❯</button>
          <button class="control" data-control="repeat" title="Repeat">↻</button>
        </div>

        <div class="controlslabel">
          Shuffle · Previous · Pause/Play · Next · Repeat
        </div>

        <div class="connect">
          <span style="color:#bed0c2;font-size:12px;font-weight:800">
            ⌁ PLAYBACK DEVICE
          </span>

          <select id="device" aria-label="Example playback device">
            <option>Warehouse Sonos (verify)</option>
            <option>iPad / browser (demo)</option>
          </select>
        </div>
      </section>
    </div>
  `;
}

function messageView(kind) {
  const sponsor = kind === "sponsors";

  const items = sponsor
    ? [...sponsorDefault, ...state.customSponsors]
    : [...announcementDefault, ...state.customAnnouncements];

  const selectedId = sponsor ? state.sponsor : state.announcement;
  const chosen = items[selectedId] || items[0];
  const color = sponsor ? "var(--sponsor)" : "var(--announce)";

  return `
    <p class="eyebrow" style="color:${color}">
      ${sponsor ? "02 / SPONSORS" : "03 / ANNOUNCEMENTS"}
    </p>

    ${
      pageHeading(
        sponsor ? "Sponsor Messages" : "Announcements",
        "Select or create the message staff will play from the soundboard."
      )
    }

    <div class="twocol">
      <section class="panel">
        <h3>MESSAGE ON THE SOUNDBOARD</h3>

        <div class="selected-large ${kind}">
          <strong>${esc(chosen.title)}</strong>
          <p>${esc(chosen.message)}</p>
        </div>

        <div class="buttonrow">
          ${messageActions(kind)}

          <button class="btn outline" data-edit="${kind}">
            ✎ Change / Create custom
          </button>
        </div>

        ${
          (sponsor ? state.editingSponsor : state.compose)
            ? editor(kind)
            : ""
        }
      </section>

      <section class="panel">
        <h3>${sponsor ? "SAVED SPONSOR MESSAGES" : "SAVED ANNOUNCEMENTS"}</h3>

        ${
          items.map((item, index) => `
            <button
              class="listitem ${index === selectedId ? "active" : ""}"
              style="--tint:${color};--tintbg:${sponsor ? "#fff0f2" : "#fff5df"}"
              data-select="${kind}:${index}"
            >
              <span class="circle">${sponsor ? "▶" : "✦"}</span>

              <span>
                <span class="listtitle">${esc(item.title)}</span>
              </span>

              ${
                index === selectedId
                  ? '<span style="margin-left:auto;font-size:11px;font-weight:800">SELECTED</span>'
                  : ""
              }
            </button>
          `).join("")
        }

        <button class="btn outline" data-edit="${kind}" style="margin-top:15px">
          ＋ Create custom ${sponsor ? "sponsor message" : "announcement"}
        </button>
      </section>
    </div>
  `;
}

function editor(kind) {
  const sponsor = kind === "sponsors";
  const draft = sponsor ? state.sponsorDraft : state.draft;

  return `
    <div style="border-top:1px solid var(--line);margin-top:19px;padding-top:10px">
      <div class="fieldlabel">
        CREATE / EDIT ${sponsor ? "SPONSOR MESSAGE" : "ANNOUNCEMENT"}
      </div>

      <label class="fieldlabel" for="customtitle">Message title</label>

      <input
        class="plaininput"
        id="customtitle"
        placeholder="${sponsor ? "e.g., Thanks to our sponsors" : "e.g., Welcome Group A"}"
        maxlength="75"
      >

      <label class="fieldlabel" for="customtext">
        What should the announcement say?
      </label>

      <textarea
        id="customtext"
        class="editor"
        maxlength="500"
        placeholder="Type a warm, natural spoken message..."
      >${esc(draft || "")}</textarea>

      <div class="formgrid">
        ${
          sponsor
            ? '<button class="btn outline" data-create-mode="recording">＋ Upload recording (future)</button>'
            : '<button class="btn outline" data-preview="announce">▷ Preview voice (demo)</button>'
        }

        <button class="btn primary ${sponsor ? "sponsors" : "announce"}" data-save="${kind}">
          ✓ Save and select
        </button>
      </div>
    </div>
  `;
}

function updateVolumes() {
  const controls = [
    ["vol", "volumevalue", state.savedVolume],
    ["sponsorvol", "sponsorvolumevalue", state.sponsorVolume],
    ["announcementvol", "announcementvolumevalue", state.announcementVolume]
  ];

  for (const [id, outputId, value] of controls) {
    const input = document.getElementById(id);

    input.value = value;
    input.setAttribute("aria-valuetext", value + " percent");

    document.getElementById(outputId).textContent = value + "%";
  }
}

function render() {
  const view = state.view;

  document.querySelectorAll("button.tab").forEach(button => {
    const active = button.dataset.view === view;

    button.classList.toggle("active", active);
    button.setAttribute("aria-current", active ? "page" : "false");
  });

  document.getElementById("view").innerHTML =
    view === "home"
      ? home()
      : view === "music"
        ? music()
        : messageView(view);

  updateVolumes();

  document.querySelectorAll("[data-stop]").forEach(button => {
    button.disabled = state.activeMessage !== button.dataset.stop;
  });

  document.getElementById("docklabel").textContent = state.duck
    ? "MUSIC · DUCKED FOR MESSAGE"
    : `MUSIC · ${state.musicPlaying ? "PLAYING" : "PAUSED"} (DEMO)`;

  document.getElementById("docktrack").textContent =
    tracks[state.trackIndex].title + " · " + playlists[state.playlist].name;

  const playButton = document.getElementById("dockplay");

  playButton.textContent = state.musicPlaying ? "Ⅱ" : "▶";
  playButton.setAttribute(
    "aria-label",
    state.musicPlaying ? "Pause Spotify music" : "Play Spotify music"
  );
  playButton.setAttribute(
    "title",
    state.musicPlaying ? "Pause Spotify music" : "Play Spotify music"
  );

  const stopButton = document.getElementById("stopall");

  stopButton.textContent = state.allAudioStopped
    ? "▶ START SPOTIFY MUSIC"
    : "■ STOP ALL AUDIO";

  stopButton.classList.toggle("is-stopped", state.allAudioStopped);

  stopButton.setAttribute(
    "aria-label",
    state.allAudioStopped
      ? "Start Spotify music (demo)"
      : "Stop all audio (demo)"
  );
}

function navTo(view) {
  state.view = view;
  render();
}

document.addEventListener("click", event => {
  const element = event.target.closest("button");

  if (!element || element.disabled) {
    return;
  }

  const data = element.dataset;

  if (data.view) {
    navTo(data.view);
    return;
  }

  if (data.stop) {
    stopMessage(data.stop);
    return;
  }

  if (data.play) {
    const item = data.play === "sponsors"
      ? getSponsor()
      : getAnnouncement();

    duckDemo(data.play, item.title);
    return;
  }

  if (data.playlist !== undefined) {
    state.playlist = Number(data.playlist);
    render();
    toast("DEMO: Selected playlist. Spotify is not connected.");
    return;
  }

  if (data.select) {
    const [kind, index] = data.select.split(":");

    if (kind === "sponsors") {
      state.sponsor = Number(index);
    } else {
      state.announcement = Number(index);
    }

    render();
    return;
  }

  if (data.edit) {
    if (data.edit === "sponsors") {
      state.editingSponsor = !state.editingSponsor;
    } else {
      state.compose = !state.compose;
    }

    render();
    return;
  }

  if (data.preview) {
    toast("DEMO: Voice preview would play privately on the iPad, not over the warehouse speakers.");
    return;
  }

  if (data.createMode) {
    toast("To upload real recordings, the Box integration must be connected.");
    return;
  }

  if (data.save) {
    const title = (document.getElementById("customtitle")?.value || "").trim();
    const message = (document.getElementById("customtext")?.value || "").trim();

    if (!title || !message) {
      toast("Add a message title and message text before saving.");
      return;
    }

    const entry = {
      title,
      description: data.save === "sponsors"
        ? "Custom text · awaiting TTS / Box"
        : "Custom message · AI voice concept",
      message
    };

    if (data.save === "sponsors") {
      state.customSponsors.push(entry);
      state.sponsor = sponsorDefault.length + state.customSponsors.length - 1;
      state.editingSponsor = false;
      state.sponsorDraft = "";
    } else {
      state.customAnnouncements.push(entry);
      state.announcement =
        announcementDefault.length + state.customAnnouncements.length - 1;
      state.compose = false;
      state.draft = "";
    }

    render();
    toast("Saved locally in this demo session and selected.");
    return;
  }

  if (data.control) {
    switch (data.control) {
      case "play":
        state.musicPlaying = !state.musicPlaying;

        if (state.musicPlaying) {
          state.allAudioStopped = false;
        }
        break;

      case "next":
        state.trackIndex = (state.trackIndex + 1) % tracks.length;
        break;

      case "prev":
        state.trackIndex =
          (state.trackIndex + tracks.length - 1) % tracks.length;
        break;

      case "shuffle":
        toast("DEMO: Shuffle toggled.");
        return;

      case "repeat":
        toast("DEMO: Repeat mode changed.");
        return;
    }

    render();
    toast("DEMO: Music control updated locally, no Spotify request made.");
  }
});

document.getElementById("stopall").addEventListener("click", toggleAllAudio);

const volumeBindings = [
  ["vol", "savedVolume"],
  ["sponsorvol", "sponsorVolume"],
  ["announcementvol", "announcementVolume"]
];

for (const [id, stateKey] of volumeBindings) {
  document.getElementById(id).addEventListener("input", event => {
    state[stateKey] = Number(event.target.value);

    if (stateKey === "savedVolume") {
      state.volume = state.duck
        ? Math.min(state.savedVolume, 25)
        : state.savedVolume;
    }

    updateVolumes();
  });
}

document.addEventListener("input", event => {
  if (event.target.id === "customtext") {
    if (state.view === "sponsors") {
      state.sponsorDraft = event.target.value;
    } else {
      state.draft = event.target.value;
    }
  }
});

document.addEventListener("change", event => {
  if (event.target.id === "device") {
    toast("DEMO only: device selection needs a real supported integration.");
  }
});

render();
</script>
</body>
</html>
